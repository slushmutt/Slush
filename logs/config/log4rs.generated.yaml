refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{h({d(%Y-%m-%d %H:%M:%S%.3f)} [{l}] {M}:{L} -> {m}{n})}"

  file_logger:
    kind: file
    path: "logs/app_2026-08-12_22-29-54.log"
    encoder:
      pattern: "{h({d(%Y-%m-%d %H:%M:%S%.3f)} [{l}] {M}:{L} -> {m}{n})}"
root:
  level: info
  appenders:
    - stdout
    - file_logger
