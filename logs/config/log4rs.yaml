refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{h({d(%Y-%m-%d %H:%M:%S%.3f)} [{l}] {M}:{L} -> {m}{n})}"

  file_logger:
    kind: file
    path: "${DYNAMIC_LOG_PATH:-logs/app.log}"
    encoder:
      pattern: "{h({d(%Y-%m-%d %H:%M:%S%.3f)} [{l}] {M}:{L} -> {m}{n})}"
root:
  level: info
  appenders:
    - stdout
    - file_logger
